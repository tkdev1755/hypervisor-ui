<app-page
  eyebrow="Formation"
  title="Apprendre TypeScript et Angular"
  subtitle="Chaque leçon montre le code à gauche et son résultat en direct à droite. Suivez-les dans l'ordre : chacune s'appuie sur la précédente. La partie 4 (Avancé) suppose les trois premières."
>
  <app-tabs [tabs]="parties" [(active)]="partie" />

  <app-column [gap]="20">
    @switch (partie()) {
      @case ('typescript') {
        <app-lesson-variables />
        <app-lesson-objects />
        <app-lesson-functions />
        <app-lesson-classes />
      }
      @case ('angular') {
        <app-lesson-component />
        <app-lesson-signals />
        <app-lesson-control-flow />
        <app-lesson-inputs-outputs />
        <app-lesson-services />
      }
      @case ('layout') {
        <app-lesson-layout />
      }
      @case ('avance') {
        <app-lesson-routing />
        <app-lesson-modals />
        <app-lesson-custom-modal />
        <app-lesson-resource-cache />
        <app-lesson-advanced-signals />
        <app-lesson-rxjs />
        <app-lesson-injection />
        <app-lesson-authentication />
      }
    }
  </app-column>
</app-page>
