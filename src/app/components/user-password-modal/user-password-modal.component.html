<app-modal-shell
  title="Réinitialiser le mot de passe"
  [subtitle]="user().username + ' sera déconnecté de toutes ses sessions.'"
  [state]="state()"
  [error]="error()"
  loadingLabel="Enregistrement…"
  successMessage="Mot de passe réinitialisé."
  (retry)="state.set('form')"
  (done)="modalRef.close(true)"
>
  <app-column [gap]="16">
    <app-text-field label="Nouveau mot de passe" type="password" hint="8 caractères au minimum." [(value)]="password" [error]="passwordError()" (enter)="submit()" />
  </app-column>

  <app-row footer [gap]="8">
    <app-button variant="ghost" (pressed)="modalRef.close()">Annuler</app-button>
    <app-button (pressed)="submit()">Réinitialiser</app-button>
  </app-row>
</app-modal-shell>
