<app-column [gap]="16">
  <app-row [gap]="8">
    <app-text color="muted">Réseaux virtuels de cet hyperviseur</app-text>
    <app-spacer />
    <app-button variant="ghost" size="sm" icon="refresh" [disabled]="loading()" (pressed)="load()">Actualiser</app-button>
    <app-button size="sm" icon="plus" (pressed)="create()">Créer un réseau</app-button>
  </app-row>

  @if (loading()) {
    <app-loading label="Chargement des réseaux…" />
  } @else if (error(); as error) {
    <app-error-panel [error]="error" [retryable]="true" (retry)="load()" />
  } @else {
    <app-grid [minItemWidth]="240">
      @for (network of networks(); track network.id) {
        <app-resource-card icon="network" [title]="network.name" [subtitle]="network.bridge ?? 'sans bridge'" [status]="network.status">
          <app-button variant="danger-ghost" size="sm" icon="trash" (pressed)="remove(network)">Supprimer</app-button>
        </app-resource-card>
      } @empty {
        <app-empty-state icon="network" title="Aucun réseau" message="Aucun réseau virtuel n'est déclaré sur cet hyperviseur." />
      }
    </app-grid>
  }
</app-column>
