<app-modal-shell
  title="Quotas"
  [subtitle]="user().username + ' · un champ vide = illimité'"
  [state]="state()"
  [error]="error()"
  loadingLabel="Enregistrement…"
  successMessage="Quotas enregistrés."
  (retry)="state.set('form')"
  (done)="modalRef.close(result() ?? undefined)"
>
  <app-column [gap]="16">
    <app-text-field label="Nombre de VM" placeholder="illimité" [(value)]="maxVms" [error]="vmsError()" (enter)="submit()" />
    <app-text-field label="Nombre de vCPU" placeholder="illimité" [(value)]="maxVcpus" [error]="vcpusError()" (enter)="submit()" />
    <app-text-field label="Mémoire (Mo)" placeholder="illimité" [(value)]="maxMemoryMb" [error]="memoryError()" (enter)="submit()" />
    <app-text-field label="Espace disque (Go)" placeholder="illimité" [(value)]="maxDiskGb" [error]="diskError()" (enter)="submit()" />
  </app-column>

  <app-row footer [gap]="8">
    <app-button variant="ghost" (pressed)="modalRef.close()">Annuler</app-button>
    <app-button (pressed)="submit()">Enregistrer</app-button>
  </app-row>
</app-modal-shell>
