<app-modal-shell
  title="Changer mon mot de passe"
  subtitle="Vos autres sessions seront fermées."
  [state]="state()"
  [error]="error()"
  loadingLabel="Enregistrement…"
  successMessage="Mot de passe modifié."
  (retry)="state.set('form')"
  (done)="modalRef.close(true)"
>
  <app-column [gap]="16">
    <app-text-field label="Mot de passe actuel" type="password" [(value)]="current" [error]="currentError()" (enter)="submit()" />
    <app-text-field label="Nouveau mot de passe" type="password" hint="8 caractères au minimum." [(value)]="next" [error]="nextError()" (enter)="submit()" />
    <app-text-field label="Confirmer le nouveau mot de passe" type="password" [(value)]="confirmation" [error]="confirmationError()" (enter)="submit()" />
  </app-column>

  <app-row footer [gap]="8">
    <app-button variant="ghost" (pressed)="modalRef.close()">Annuler</app-button>
    <app-button (pressed)="submit()">Enregistrer</app-button>
  </app-row>
</app-modal-shell>
