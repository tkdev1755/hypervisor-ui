<app-column [gap]="16">
  <app-row [gap]="8">
    <app-text color="muted">Disques de cet hyperviseur</app-text>
    <app-spacer />
    <app-button variant="ghost" size="sm" icon="refresh" [disabled]="loading()" (pressed)="load()">Actualiser</app-button>
    <app-button size="sm" icon="plus" (pressed)="create()">Créer un disque</app-button>
  </app-row>

  @if (loading()) {
    <app-loading label="Chargement des disques…" />
  } @else if (error(); as error) {
    <app-error-panel [error]="error" [retryable]="true" (retry)="load()" />
  } @else {
    <app-grid [minItemWidth]="240">
      @for (disk of disks(); track disk.id) {
        <app-resource-card icon="disk" [title]="disk.name" [subtitle]="disk.format" [meta]="disk.size_gb + ' Go'">
          <app-button variant="danger-ghost" size="sm" icon="trash" (pressed)="remove(disk)">Supprimer</app-button>
        </app-resource-card>
      } @empty {
        <app-empty-state icon="disk" title="Aucun disque" message="Aucun disque n'est déclaré sur cet hyperviseur." />
      }
    </app-grid>
  }
</app-column>
