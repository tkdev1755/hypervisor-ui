@if (icon(); as icon) {
  <div class="leading"><app-icon [name]="icon" [size]="16" /></div>
}
<div class="texts">
  <div class="title">{{ title() }}</div>
  @if (subtitle()) {
    <div class="subtitle">{{ subtitle() }}</div>
  }
</div>
@if (status(); as status) {
  <app-status-badge [status]="status" />
}
<div class="trailing">
  <ng-content />
</div>
