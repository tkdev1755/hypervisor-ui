# Entrée HTTPS du front (voir docker-compose.yml) : haproxy chiffre, nginx (ui:8080) sert
# l'application et relaie /api vers l'API. Repris du haproxy.cfg de hypervisor-api.
#
# Le conteneur écoute sur 8080 (HTTP, redirigé vers HTTPS) et 8443 (HTTPS) : pas besoin de port
# privilégié à l'intérieur. docker-compose.yml les relie à HTTP_PORT et HTTPS_PORT (80 et 443) sur la machine.

global
    log stdout format raw local0 info
    # TLS 1.2 et 1.3 seulement, avec la liste « intermediate » de Mozilla.
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    # La clé privée est dans son propre fichier, à côté du certificat : <certificat>.key.
    ssl-load-extra-files key

# Le DNS de Docker : haproxy démarre même si le front n'est pas encore prêt, et suit ses redémarrages.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    # Un peu plus que nginx (proxy_read_timeout 120s) : c'est nginx qui répond en cas de lenteur de l'API.
    timeout server 130s
    timeout http-request 10s
    default-server init-addr last,libc,none resolvers docker

frontend http
    bind :8080
    http-request redirect code 301 location "https://%[req.hdr(host),field(1,:)]:${HTTPS_PORT}%[capture.req.uri]"

frontend https
    # Certificat (et chaîne) dans site.pem, clé privée dans site.pem.key (docker-compose.yml).
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-Proto https

    # Freine les essais de mots de passe : au plus 20 requêtes d'authentification par 10 s et par adresse
    # (nginx parle directement à l'API : le haproxy de l'API ne voit pas ces requêtes).
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
    acl is_auth path_beg /api/auth/
    http-request track-sc0 src if is_auth
    http-request deny deny_status 429 if is_auth { sc_http_req_rate(0) gt 20 }

    http-response set-header Strict-Transport-Security "max-age=31536000"

    default_backend ui

backend ui
    # Vérifie nginx lui-même (/), pas l'API : le front reste joignable même si l'API est arrêtée.
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost
    server ui ui:8080 check
